<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="caseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3D40"/>
      <stop offset="50%" stop-color="#242628"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>
    <linearGradient id="earbudStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B4E53"/>
      <stop offset="100%" stop-color="#1E2022"/>
    </linearGradient>
    <filter id="budShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="255" rx="75" ry="16" fill="#05120d" opacity="0.65"/>

  <g filter="url(#budShadow)">
    <!-- Standing Earbud in rear -->
    <g transform="translate(142, 60)">
      <!-- Head -->
      <path d="M12,25 C-5,25 -5,4 12,4 C22,4 28,12 28,25 Z" fill="url(#earbudStem)"/>
      <ellipse cx="20" cy="16" rx="9" ry="8" fill="#151618"/>
      <!-- Stem -->
      <rect x="18" y="22" width="10" height="55" rx="5" fill="url(#earbudStem)"/>
      <!-- Mesh grill -->
      <ellipse cx="23" cy="16" rx="4" ry="4" fill="#0D0E10" stroke="#3A3D40" stroke-width="0.5"/>
      <!-- Stem highlight -->
      <line x1="20" y1="26" x2="20" y2="72" stroke="#686C72" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Charging Case Base -->
    <rect x="95" y="125" width="110" height="100" rx="26" fill="url(#caseBody)" stroke="#4A4E53" stroke-width="1.5"/>

    <!-- Case Open Interior Well -->
    <ellipse cx="150" cy="125" rx="48" ry="14" fill="#0E1012" stroke="#25282B" stroke-width="1.5"/>

    <!-- Left Earbud in case -->
    <rect x="118" y="112" width="14" height="20" rx="6" fill="#181A1C"/>
    <ellipse cx="125" cy="110" rx="8" ry="6" fill="#25282B"/>

    <!-- Case Front LED indicator -->
    <circle cx="150" cy="158" r="2.5" fill="#55E6C1" opacity="0.9"/>

    <!-- Case seam line -->
    <path d="M96,125 Q150,132 204,125" fill="none" stroke="#52575D" stroke-width="1.2" opacity="0.5"/>

    <!-- Case highlight -->
    <path d="M102,145 Q102,210 135,220" fill="none" stroke="#686C72" stroke-width="2" opacity="0.25"/>
  </g>
</svg>
