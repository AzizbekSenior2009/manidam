<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="walletLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="70%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#271612"/>
    </linearGradient>
    <filter id="wallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <ellipse cx="150" cy="245" rx="75" ry="14" fill="#05120d" opacity="0.6"/>
  <g filter="url(#wallShadow)">
    <rect x="70" y="85" width="160" height="125" rx="14" fill="url(#walletLeather)" stroke="#8D6E63" stroke-width="2"/>
    <!-- Stitching around edge -->
    <rect x="76" y="91" width="148" height="113" rx="10" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.8"/>
    <!-- Flap fold -->
    <path d="M70,125 Q150,135 230,125" stroke="#271612" stroke-width="2" fill="none"/>
    <!-- Metal Gold Logo Clasp -->
    <rect x="195" y="135" width="28" height="22" rx="4" fill="#D4AF37" stroke="#FFF2A3" stroke-width="1"/>
    <circle cx="209" cy="146" r="3" fill="#3E2723"/>
  </g>
</svg>
