<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <radialGradient id="teapotBody" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2EEF8"/>
      <stop offset="80%" stop-color="#144272"/>
      <stop offset="100%" stop-color="#0A2647"/>
    </radialGradient>
    <linearGradient id="teapotGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
    <filter id="teapotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="160" cy="245" rx="90" ry="16" fill="#05120d" opacity="0.6"/>

  <g filter="url(#teapotShadow)">
    <!-- Teapot Handle (left side in mockup) -->
    <path d="M110,110 C45,100 45,210 120,205 C130,205 130,195 120,195 C70,195 70,120 115,122 Z" fill="#144272" stroke="url(#teapotGold)" stroke-width="1.5"/>

    <!-- Teapot Spout (right side) -->
    <path d="M205,140 C235,130 255,90 268,75 C263,73 255,75 250,82 C238,102 215,145 195,160 Z" fill="#144272" stroke="url(#teapotGold)" stroke-width="1.5"/>

    <!-- Teapot Foot/Base -->
    <ellipse cx="160" cy="225" rx="50" ry="12" fill="#0A2647" stroke="url(#teapotGold)" stroke-width="2"/>

    <!-- Teapot Body -->
    <ellipse cx="160" cy="165" rx="72" ry="60" fill="url(#teapotBody)" stroke="#0A2647" stroke-width="2"/>

    <!-- Central Uzbek floral emblem on teapot -->
    <ellipse cx="160" cy="165" rx="38" ry="32" fill="#0A2647" stroke="url(#teapotGold)" stroke-width="2"/>
    <circle cx="160" cy="165" r="14" fill="#D7263D"/>
    <!-- Gold petals -->
    <circle cx="160" cy="148" r="6" fill="url(#teapotGold)"/>
    <circle cx="160" cy="182" r="6" fill="url(#teapotGold)"/>
    <circle cx="144" cy="165" r="6" fill="url(#teapotGold)"/>
    <circle cx="176" cy="165" r="6" fill="url(#teapotGold)"/>
    <!-- Delicate arabesque swirls -->
    <path d="M130,165 Q140,150 160,150 Q180,150 190,165" fill="none" stroke="url(#teapotGold)" stroke-width="1.5"/>

    <!-- Teapot Neck / Rim -->
    <ellipse cx="160" cy="112" rx="36" ry="10" fill="#0A2647" stroke="url(#teapotGold)" stroke-width="2"/>

    <!-- Teapot Lid -->
    <path d="M132,112 C132,95 188,95 188,112 Z" fill="url(#teapotBody)" stroke="url(#teapotGold)" stroke-width="2"/>
    <!-- Lid Golden Crown / Finial -->
    <path d="M154,95 C154,82 166,82 166,95 Z" fill="url(#teapotGold)"/>
    <circle cx="160" cy="80" r="7" fill="url(#teapotGold)"/>

    <!-- Glaze highlight -->
    <path d="M125,145 Q135,130 150,135" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
