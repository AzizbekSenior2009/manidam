<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="choponGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A1F40"/>
      <stop offset="50%" stop-color="#E28743"/>
      <stop offset="100%" stop-color="#144272"/>
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <ellipse cx="150" cy="265" rx="70" ry="14" fill="#05120d" opacity="0.6"/>
  <g filter="url(#cShadow)">
    <!-- Silk Robe Outline -->
    <path d="M110,65 L150,85 L190,65 L245,115 L215,145 L185,120 L195,245 L105,245 L115,120 L85,145 L55,115 Z" fill="url(#choponGrad)" stroke="#D4AF37" stroke-width="2"/>
    <!-- Traditional Ikat / Adras stripes -->
    <path d="M125,95 Q150,110 175,95" stroke="#FFF2A3" stroke-width="2.5" fill="none"/>
    <path d="M120,130 Q150,145 180,130" stroke="#55E6C1" stroke-width="2" fill="none"/>
    <path d="M115,165 Q150,180 185,165" stroke="#F1D675" stroke-width="2.5" fill="none"/>
    <path d="M110,200 Q150,215 190,200" stroke="#FFF2A3" stroke-width="2" fill="none"/>
    <!-- Gold Trim down the center -->
    <line x1="150" y1="85" x2="150" y2="245" stroke="#D4AF37" stroke-width="4"/>
  </g>
</svg>
