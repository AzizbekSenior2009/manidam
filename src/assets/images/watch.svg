<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="watchScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#243B55"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E272C"/>
      <stop offset="50%" stop-color="#37474F"/>
      <stop offset="100%" stop-color="#1E272C"/>
    </linearGradient>
    <filter id="watchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <ellipse cx="150" cy="260" rx="60" ry="12" fill="#05120d" opacity="0.6"/>
  <g filter="url(#watchShadow)">
    <!-- Straps -->
    <rect x="120" y="25" width="60" height="70" rx="8" fill="url(#strapGrad)"/>
    <rect x="120" y="200" width="60" height="70" rx="8" fill="url(#strapGrad)"/>
    <!-- Case -->
    <rect x="100" y="85" width="100" height="120" rx="26" fill="#1C2321" stroke="#D4AF37" stroke-width="2.5"/>
    <!-- Digital Crown button -->
    <rect x="202" y="115" width="6" height="24" rx="2" fill="#D4AF37"/>
    <!-- Screen -->
    <rect x="106" y="91" width="88" height="108" rx="20" fill="url(#watchScreen)"/>
    <!-- Watchface text -->
    <text x="150" y="142" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FFF2A3" text-anchor="middle">10:45</text>
    <text x="150" y="162" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#55E6C1" text-anchor="middle">7,842 BPM 72</text>
    <!-- Activity ring -->
    <circle cx="150" cy="145" r="38" fill="none" stroke="#D7263D" stroke-width="2.5" stroke-dasharray="160 80" opacity="0.4"/>
  </g>
</svg>
