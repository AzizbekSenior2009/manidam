<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="washerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAECEE"/>
      <stop offset="100%" stop-color="#BDC3C7"/>
    </linearGradient>
    <filter id="wShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <ellipse cx="150" cy="265" rx="75" ry="14" fill="#05120d" opacity="0.6"/>
  <g filter="url(#wShadow)">
    <rect x="75" y="45" width="150" height="205" rx="14" fill="url(#washerBody)" stroke="#95A5A6" stroke-width="2"/>
    <!-- Top display panel -->
    <rect x="85" y="55" width="130" height="38" rx="6" fill="#1C2833"/>
    <rect x="92" y="62" width="40" height="24" rx="4" fill="#2C3E50"/>
    <circle cx="150" cy="74" r="10" fill="#34495E" stroke="#BDC3C7" stroke-width="2"/>
    <rect x="175" y="65" width="30" height="18" rx="3" fill="#00FFCC" opacity="0.8"/>
    <!-- Circular Drum Door -->
    <circle cx="150" cy="160" r="54" fill="#2C3E50" stroke="#7F8C8D" stroke-width="4"/>
    <circle cx="150" cy="160" r="42" fill="#1A252F" stroke="#BDC3C7" stroke-width="2"/>
    <circle cx="150" cy="160" r="30" fill="#0E161D"/>
    <!-- Blue tinted reflection -->
    <path d="M125,145 Q150,130 170,145" stroke="#3498DB" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
</svg>
