<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="headband" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2024"/>
      <stop offset="50%" stop-color="#3A3E45"/>
      <stop offset="100%" stop-color="#1E2024"/>
    </linearGradient>
    <filter id="hpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <ellipse cx="150" cy="255" rx="80" ry="15" fill="#05120d" opacity="0.6"/>
  <g filter="url(#hpShadow)">
    <!-- Headband Arc -->
    <path d="M75,155 C75,55 225,55 225,155" fill="none" stroke="url(#headband)" stroke-width="20" stroke-linecap="round"/>
    <path d="M90,140 C90,75 210,75 210,140" fill="none" stroke="#25282E" stroke-width="12" stroke-linecap="round"/>
    <!-- Soft cushion inner -->
    <path d="M105,120 C105,85 195,85 195,120" fill="none" stroke="#121316" stroke-width="8"/>
    <!-- Left Earcup -->
    <g transform="translate(60, 140)">
      <rect x="0" y="0" width="30" height="70" rx="15" fill="#1C1E22" stroke="#383D45" stroke-width="2"/>
      <ellipse cx="10" cy="35" rx="7" ry="28" fill="#111214"/>
      <!-- Gold accent ring -->
      <ellipse cx="22" cy="35" rx="3" ry="16" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.8"/>
    </g>
    <!-- Right Earcup -->
    <g transform="translate(210, 140)">
      <rect x="0" y="0" width="30" height="70" rx="15" fill="#1C1E22" stroke="#383D45" stroke-width="2"/>
      <ellipse cx="20" cy="35" rx="7" ry="28" fill="#111214"/>
      <!-- Gold accent ring -->
      <ellipse cx="8" cy="35" rx="3" ry="16" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.8"/>
    </g>
  </g>
</svg>
