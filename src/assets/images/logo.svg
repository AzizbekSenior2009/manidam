<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="30%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7718"/>
    </linearGradient>
    <linearGradient id="goldAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1D675"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Bag Handles -->
  <path d="M35,32 C35,16 65,16 65,32" fill="none" stroke="url(#goldBagGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Bag Body -->
  <path d="M22,32 L78,32 L84,86 C84,90 80,93 75,93 L25,93 C20,93 16,90 16,86 Z" fill="url(#goldBagGrad)" filter="url(#goldGlow)"/>

  <!-- Bag Top Trim & Fold Line -->
  <path d="M20,32 L80,32 L79,38 L21,38 Z" fill="#B8860B" opacity="0.4"/>
  <path d="M23,38 Q50,42 77,38" fill="none" stroke="#FFF2A3" stroke-width="1.2" opacity="0.7"/>

  <!-- Stylized Letter 'M' with dynamic folded ribbon look -->
  <g id="letterM" fill="none" stroke="#0C241D" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M34,74 L34,48 L50,65 L66,48 L66,74" />
  </g>
  <g id="letterMHighlight" fill="none" stroke="#163C30" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M34,74 L34,48 L50,65 L66,48 L66,74" />
  </g>
  <!-- Subtle gold facet cut across the M -->
  <path d="M50,65 L63,52 L60,49 L48,62 Z" fill="#FFF2A3" opacity="0.9"/>
</svg>
