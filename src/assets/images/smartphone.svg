<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="40%" stop-color="#11998e"/>
      <stop offset="70%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff7eb3"/>
    </linearGradient>
    <linearGradient id="phoneBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49657B"/>
      <stop offset="60%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#1A252F"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="265" rx="90" ry="16" fill="#05120d" opacity="0.6" />

  <!-- Phone angled/rear peek -->
  <g filter="url(#phoneShadow)">
    <!-- Back unit peek -->
    <rect x="70" y="45" width="100" height="200" rx="18" fill="url(#phoneBack)" stroke="#5D7A94" stroke-width="2"/>
    <!-- Rear camera bump -->
    <rect x="76" y="52" width="28" height="60" rx="8" fill="#15212A" stroke="#3D5365" stroke-width="1.5"/>
    <circle cx="90" cy="64" r="6" fill="#0B1015" stroke="#4A6572" stroke-width="1.5"/>
    <circle cx="90" cy="80" r="6" fill="#0B1015" stroke="#4A6572" stroke-width="1.5"/>
    <circle cx="90" cy="96" r="4" fill="#0B1015" stroke="#4A6572" stroke-width="1"/>

    <!-- Front main phone -->
    <g transform="translate(30, -5)">
      <!-- Frame -->
      <rect x="85" y="45" width="105" height="210" rx="18" fill="#0D1117" stroke="#90A4AE" stroke-width="2.5"/>
      <!-- Screen bezel -->
      <rect x="88" y="48" width="99" height="204" rx="15" fill="#000000"/>
      <!-- Screen display -->
      <rect x="90" y="50" width="95" height="200" rx="13" fill="url(#phoneScreen)"/>
      <!-- Punch hole camera -->
      <circle cx="137.5" cy="58" r="3" fill="#000000"/>
      <!-- Speaker grill slit -->
      <rect x="127" y="51" width="21" height="1.5" rx="0.75" fill="#263238"/>
      <!-- Screen glass glare reflection -->
      <path d="M90,50 L160,50 L115,250 L90,250 Z" fill="#ffffff" opacity="0.15"/>
    </g>
  </g>
</svg>
