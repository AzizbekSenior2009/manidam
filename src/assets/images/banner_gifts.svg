<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGreen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4D3E"/>
      <stop offset="60%" stop-color="#14392E"/>
      <stop offset="100%" stop-color="#0A221A"/>
    </linearGradient>
    <linearGradient id="boxGreen2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6B57"/>
      <stop offset="100%" stop-color="#174335"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="40%" stop-color="#E5C158"/>
      <stop offset="80%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7718"/>
    </linearGradient>
    <filter id="giftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Golden Confetti / Sparkles floating -->
  <g fill="#F1D675" opacity="0.8">
    <circle cx="35" cy="50" r="3"/>
    <circle cx="210" cy="40" r="2.5"/>
    <circle cx="195" cy="18" r="3.5"/>
    <path d="M40,25 Q50,20 45,35" stroke="#F1D675" stroke-width="2" fill="none"/>
    <path d="M220,70 Q235,80 230,95" stroke="#F1D675" stroke-width="2.5" fill="none"/>
    <path d="M15,95 Q25,100 20,115" stroke="#D4AF37" stroke-width="2" fill="none"/>
  </g>

  <!-- Background base gifts & large stack -->
  <g filter="url(#giftShadow)">
    <!-- Right lower gift box -->
    <g transform="translate(145, 110)">
      <!-- Box body -->
      <path d="M25,25 L65,10 L75,65 L35,80 Z" fill="#14392E"/>
      <path d="M0,40 L35,80 L35,25 L0,0 Z" fill="#1E4D3E"/>
      <path d="M0,0 L35,25 L65,10 L30,-15 Z" fill="#2D6B57"/>
      <!-- Gold Ribbon -->
      <path d="M15,10 L15,65 L22,60 L22,12 Z" fill="url(#goldRibbon)"/>
      <path d="M0,15 L65,55 L65,48 L0,8 Z" fill="url(#goldRibbon)"/>
      <!-- Bow -->
      <ellipse cx="32" cy="10" rx="9" ry="5" fill="url(#goldRibbon)" transform="rotate(-15 32 10)"/>
      <ellipse cx="32" cy="10" rx="5" ry="9" fill="url(#goldRibbon)" transform="rotate(35 32 10)"/>
    </g>

    <!-- Left lower gift box -->
    <g transform="translate(45, 120)">
      <!-- Box body -->
      <rect x="0" y="20" width="55" height="50" rx="4" fill="url(#boxGreen1)" stroke="rgba(212,175,55,0.2)"/>
      <rect x="-3" y="15" width="61" height="12" rx="3" fill="url(#boxGreen2)"/>
      <!-- Ribbon vertical -->
      <rect x="22" y="15" width="11" height="55" fill="url(#goldRibbon)"/>
      <!-- Ribbon horizontal -->
      <rect x="0" y="38" width="55" height="11" fill="url(#goldRibbon)"/>
      <!-- Bow top -->
      <circle cx="28" cy="14" r="7" fill="url(#goldRibbon)"/>
      <circle cx="28" cy="14" r="3.5" fill="#9A7718"/>
    </g>

    <!-- Center main stacked gift box -->
    <g transform="translate(90, 50)">
      <!-- Main Green Gift Box (Top of stack) -->
      <rect x="5" y="22" width="70" height="55" rx="5" fill="url(#boxGreen1)" stroke="rgba(212,175,55,0.3)"/>
      <!-- Lid -->
      <rect x="0" y="14" width="80" height="15" rx="4" fill="url(#boxGreen2)"/>
      <!-- Gold Ribbon -->
      <rect x="33" y="14" width="14" height="63" fill="url(#goldRibbon)"/>
      <!-- Bow loops -->
      <ellipse cx="30" cy="12" rx="13" ry="7" fill="url(#goldRibbon)" transform="rotate(-25 30 12)"/>
      <ellipse cx="50" cy="12" rx="13" ry="7" fill="url(#goldRibbon)" transform="rotate(25 50 12)"/>
      <circle cx="40" cy="14" r="5" fill="url(#goldRibbon)"/>
    </g>

    <!-- Middle Golden Box under main box -->
    <g transform="translate(75, 100)">
      <rect x="10" y="18" width="105" height="45" rx="4" fill="url(#goldRibbon)" opacity="0.95"/>
      <rect x="5" y="10" width="115" height="14" rx="3" fill="#FFF2A3"/>
      <!-- Emerald Ribbon on gold box -->
      <rect x="55" y="10" width="15" height="53" fill="#14392E"/>
    </g>
  </g>
</svg>
