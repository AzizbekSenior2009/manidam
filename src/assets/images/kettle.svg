<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="100%" height="100%">
  <defs>
    <radialGradient id="ironBody" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4B4F56"/>
      <stop offset="50%" stop-color="#282B30"/>
      <stop offset="100%" stop-color="#121417"/>
    </radialGradient>
    <linearGradient id="ironHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6D1F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
    <filter id="kettleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <ellipse cx="150" cy="245" rx="75" ry="15" fill="#05120d" opacity="0.6"/>
  <g filter="url(#kettleShadow)">
    <!-- Overhead arched handle -->
    <path d="M90,145 C80,60 220,60 210,145" fill="none" stroke="url(#ironHandle)" stroke-width="8" stroke-linecap="round"/>
    <path d="M125,75 L175,75" stroke="#3A2C10" stroke-width="12" stroke-linecap="round"/>

    <!-- Spout (left) -->
    <path d="M100,165 C60,150 50,110 40,95 C45,95 55,98 62,108 C75,130 90,145 105,152 Z" fill="#282B30" stroke="#4B4F56" stroke-width="1"/>

    <!-- Kettle Body (round pot) -->
    <ellipse cx="150" cy="180" rx="68" ry="52" fill="url(#ironBody)" stroke="#383B40" stroke-width="2"/>

    <!-- Cast Iron Texture / Dimples -->
    <g fill="#181A1D" opacity="0.4">
      <circle cx="120" cy="170" r="2"/>
      <circle cx="140" cy="165" r="2"/>
      <circle cx="160" cy="175" r="2"/>
      <circle cx="180" cy="165" r="2"/>
      <circle cx="130" cy="190" r="2"/>
      <circle cx="150" cy="195" r="2"/>
      <circle cx="170" cy="190" r="2"/>
    </g>

    <!-- Kettle Lid & Knob -->
    <ellipse cx="150" cy="135" rx="35" ry="10" fill="#282B30" stroke="#4B4F56" stroke-width="1.5"/>
    <circle cx="150" cy="125" r="6" fill="url(#ironHandle)"/>
  </g>
</svg>
